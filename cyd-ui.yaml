    id: text_font_14
    size: 14
    bpp: 4
    glyphs:
      - " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"
      - "áéíóúüñÁÉÍÓÚÜÑ¿¡°‹›"
  # Catálogo MDI deliberadamente reducido: se compilan solo estos glifos.
  - file: "gfonts://Roboto"
    id: clock_time_font_60
    size: 60
    bpp: 4
    glyphs:
      - "0123456789:"
  - file: "gfonts://Roboto"
    id: clock_date_font_18
    size: 18
    bpp: 4
    glyphs:
      - " 0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"
      - "áéíóúüñÁÉÍÓÚÜÑ"
