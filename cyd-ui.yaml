esphome:
  name: cyd-ui
  friendly_name: CYD UI Lab

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

time:
  - platform: sntp
    id: system_time
    timezone: America/Montevideo

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

mqtt:
  broker: 192.168.31.240
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false
  topic_prefix: cyd-ui
  on_connect:
    - lambda: |-
        id(ui_engine_main).set_backend_connected(true);
        id(ui_engine_main).request_reload();
    - delay: 4s
    - mqtt.publish_json:
        topic: esphome_ui/cyd-ui/cmd
        qos: 1
        retain: false
        payload: |-
          root["type"] = "sync_request";
  on_disconnect:
    - lambda: |-
        id(ui_engine_main).set_backend_connected(false);
  on_json_message:
    - topic: esphome_ui/cyd-ui/event
      qos: 1
      then:
        - lambda: |-
            const std::string type = x["type"] | "";
            if (type == "reload") {
              id(ui_engine_main).request_reload();
            } else if (type == "control_changed") {
              const std::string control_id = x["id"] | "";
              const bool active = x["active"] | false;
              const std::string value = x["value"] | "";
              const std::string reliability = x["reliability"] | "valid";
              if (!control_id.empty()) {
                id(ui_engine_main).update_control(control_id, active, value, reliability);
              }
            } else if (type == "sound") {
              const std::string sound = x["sound"] | "";
              if (sound == "attention") {
                id(ui_sound).play("attention:d=32,o=6,b=220:g,p,g");
              } else if (sound == "notification") {
                id(ui_sound).play("notification:d=32,o=6,b=180:c,e");
              } else if (sound == "success") {
                id(ui_sound).play("success:d=32,o=6,b=180:c,e,g");
              } else if (sound == "warning") {
                id(ui_sound).play("warning:d=16,o=5,b=180:a,p,a");
              } else if (sound == "error") {
                id(ui_sound).play("error:d=16,o=4,b=160:g");
              }
            }

http_request:
  id: ui_http
  timeout: 3s
  watchdog_timeout: 10s
  follow_redirects: true

external_components:
  - source:
      type: local
      path: components

spi:
  - id: display_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12

  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

output:
  - platform: gpio
    id: backlight_output
    pin: GPIO21
  - platform: ledc
    id: ui_speaker_output
    pin: GPIO26

rtttl:
  id: ui_sound
  output: ui_speaker_output
  gain: 18%

script:
  - id: ui_sound_tap
    mode: restart
    then:
      - rtttl.play: "tap:d=32,o=6,b=180:c"
  - id: ui_sound_navigation
    mode: restart
    then:
      - rtttl.play: "nav:d=32,o=6,b=200:g"
  - id: ui_sound_success
    mode: restart
    then:
      - rtttl.play: "ok:d=32,o=6,b=180:c,e"
  - id: ui_sound_error
    mode: restart
    then:
      - rtttl.play: "err:d=16,o=4,b=160:g"

light:
  - platform: binary
    id: backlight
    name: Backlight
    output: backlight_output
    restore_mode: ALWAYS_ON

display:
  - platform: mipi_spi
    id: cyd_display
    spi_id: display_spi
    model: ESP32-2432S028
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: xpt2046
    id: cyd_touch
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    threshold: 400
    calibration:
      x_min: 200
      x_max: 3700
      y_min: 240
      y_max: 3800
    transform:
      mirror_x: true
    on_touch:
      - lambda: id(ui_engine_main).notify_activity();

lvgl:
  id: cyd_lvgl
  rotation: 90
  displays:
    - cyd_display
  touchscreens:
    - touchscreen_id: cyd_touch
  buffer_size: 8%
  bg_color: 0x101820
  text_color: 0xFFFFFF
  widgets:
    - button:
        hidden: true
        widgets:
          - label:
              text: "ui_engine module declaration"

ui_engine:
  id: ui_engine_main
  config_file: config/ui.json
  http_request_id: ui_http
  config_url: http://192.168.31.240:8124/ui.json
  time_id: system_time
  screensaver_timeout: 30s
  on_action:
    - script.execute: ui_sound_tap
    - logger.log:
        format: "UI action: control_id=%s action=%s"
        args:
          - control_id.c_str()
          - action.c_str()
    - mqtt.publish_json:
        topic: esphome_ui/cyd-ui/cmd
        qos: 1
        retain: false
        payload: |-
          root["type"] = "action";
          root["id"] = control_id;
          root["action"] = action;
  on_navigation:
    - script.execute: ui_sound_navigation
