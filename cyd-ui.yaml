esphome:
  name: cyd-ui
  friendly_name: CYD UI Lab

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

globals:
  # Prevent the two-second connectivity watchdog from overwriting a temporary
  # notification color before the user can see it.
  - id: notification_led_override
    type: bool
    restore_value: no
    initial_value: "false"

time:
  - platform: sntp
    id: system_time
    timezone: America/Montevideo

wifi:
  power_save_mode: none
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_home_ssid
      password: !secret wifi_home_password
  ap:
    ssid: "CYD UI Setup"
    password: !secret fallback_ap_password
  on_connect:
    - lambda: id(ui_engine_main).set_startup_status("Wi-Fi conectado; esperando Home Assistant");
    - lambda: id(ui_engine_main).set_backend_connected(false);
    - lambda: id(ui_engine_main).set_connection_state(1);
    # Wi-Fi sin Home Assistant todavía es una falla de sincronización: naranja.
    # El LED se apaga cuando la API de Home Assistant se conecta más abajo.
    - light.turn_on:
        id: status_led
        red: 100%
        green: 100%
        blue: 0%
  on_disconnect:
    - lambda: id(ui_engine_main).set_startup_status("Conectando a Wi-Fi...");
    - lambda: id(ui_engine_main).set_backend_connected(false);
    - lambda: id(ui_engine_main).set_connection_state(0);
    - light.turn_on:
        id: status_led
        red: 100%
        green: 0%
        blue: 0%

captive_portal:

interval:
  - interval: 2s
    then:
      - if:
          condition:
            wifi.ap_active:
          then:
            - lambda: |-
                id(ui_engine_main).set_wifi_setup_visible(true, "CYD UI Setup", "12345678");
            - lambda: id(ui_engine_main).set_connection_state(3);
            - light.turn_on:
                id: status_led
                red: 0%
                green: 20%
                blue: 100%
          else:
            - lambda: |-
                id(ui_engine_main).set_wifi_setup_visible(false, "", "");
            - if:
                condition:
                  wifi.connected:
                then:
                  - if:
                      condition:
                        lambda: return id(ui_engine_main).backend_connected();
                      then:
                        - lambda: id(ui_engine_main).set_connection_state(2);
                      else:
                        - lambda: id(ui_engine_main).set_connection_state(1);
                else:
                  - lambda: id(ui_engine_main).set_connection_state(0);
            - if:
                condition:
                  lambda: |-
                    return !id(ui_engine_main).backend_connected() &&
                           !id(notification_led_override);
                then:
                  - script.execute: restore_status_led

api:
  id: cyd_api
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - delay: 2s
    - if:
        condition:
          api.connected:
            state_subscription_only: true
        then:
          - lambda: id(ui_engine_main).set_backend_connected(true);
          - lambda: id(ui_engine_main).set_startup_status("Home Assistant conectado");
          - lambda: id(ui_engine_main).set_connection_state(2);
          - light.turn_off: status_led
          - homeassistant.event:
              event: esphome.cyd_ui_ready
              data:
                device_id: cyd-ui
  on_client_disconnected:
    - if:
        condition:
          api.connected:
            state_subscription_only: true
        then:
          - lambda: id(ui_engine_main).set_backend_connected(true);
        else:
          - lambda: id(ui_engine_main).set_backend_connected(false);
          - lambda: id(ui_engine_main).set_connection_state(1);
          - light.turn_on:
              id: status_led
              red: 100%
              green: 100%
              blue: 0%
  actions:
    - action: play_sound
      variables:
        sound: string
      then:
        - lambda: id(ui_engine_main).play_notification_sound(sound);
    - action: preview_notification_sound
      variables:
        volume: int
      then:
        - lambda: id(ui_engine_main).preview_notification_sound(static_cast<uint8_t>(volume));
    - action: show_reminder
      variables:
        reminder_id: string
        title: string
        message: string
        level: string
        sound: bool
      then:
        - lambda: |-
            id(ui_engine_main).show_reminder(reminder_id, title, message, level);
        - if:
            condition:
              lambda: return sound;
            then:
              - lambda: |-
                  id(ui_engine_main).play_notification_sound(
                    level == "urgent" ? "warning" : "notification");
    - action: show_alarm_reminder
      variables:
        reminder_id: string
        title: string
        message: string
        level: string
        alarm_duration: int
        snooze_minutes: int
      then:
        - lambda: |-
            id(ui_engine_main).show_alarm_reminder(
              reminder_id, title, message, level,
              static_cast<uint16_t>(alarm_duration),
              static_cast<uint16_t>(snooze_minutes));
    - action: dismiss_reminder
      variables:
        reminder_id: string
      then:
        - lambda: id(ui_engine_main).dismiss_reminder(reminder_id);
    - action: flash_notification_led
      variables:
        color: string
      then:
        - lambda: id(notification_led_override) = true;
        - lambda: |-
            auto call = id(status_led).turn_on();
            call.set_transition_length(0);
            if (color == "red") call.set_rgb(1.0f, 0.0f, 0.0f);
            else if (color == "green") call.set_rgb(0.0f, 1.0f, 0.0f);
            else if (color == "blue") call.set_rgb(0.0f, 0.25f, 1.0f);
            else if (color == "violet") call.set_rgb(0.65f, 0.0f, 1.0f);
            else call.set_rgb(1.0f, 0.35f, 0.0f);  // amber, the safe default
            call.perform();
        - delay: 2s
        - lambda: id(notification_led_override) = false;
        - script.execute: restore_status_led
    - action: start_touch_calibration
      then:
        - lambda: id(ui_engine_main).start_touch_calibration();
    - action: update_control
      variables:
        control_id: string
        active: bool
        value: string
        reliability: string
      then:
        - lambda: |-
            id(ui_engine_main).update_control(control_id, active, value, reliability);
    - action: reload_ui
      then:
        - lambda: id(ui_engine_main).request_reload();
    - action: apply_config
      variables:
        config: string
      then:
        - lambda: id(ui_engine_main).apply_config(config);

ota:
  - platform: esphome
    password: !secret ota_password

http_request:
  id: ui_http
  timeout: 3s
  watchdog_timeout: 10s
  follow_redirects: true

external_components:
  - source:
      type: local
      path: components

spi:
  - id: display_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12

  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO21
    frequency: 20kHz
    channel: 2
  - platform: ledc
    id: ui_speaker_output
    pin: GPIO26
    channel: 0
  - platform: ledc
    id: status_led_red
    pin:
      number: GPIO4
      inverted: true
    frequency: 1kHz
    channel: 1
  - platform: ledc
    id: status_led_green
    pin:
      number: GPIO16
      inverted: true
    frequency: 1kHz
    channel: 3
  - platform: ledc
    id: status_led_blue
    pin:
      number: GPIO17
      inverted: true
    frequency: 1kHz
    channel: 4

sensor:
  - platform: adc
    id: ambient_light_voltage
    name: "Voltaje LDR"
    icon: mdi:brightness-6
    entity_category: diagnostic
    pin: GPIO34
    attenuation: auto
    update_interval: 1s
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
    on_value:
      - lambda: id(ui_engine_main).set_ambient_light(x);
  - platform: template
    name: "Luz ambiental"
    id: ambient_light_percent
    icon: mdi:brightness-percent
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 5s
    lambda: return id(ui_engine_main).ambient_light_percent();

rtttl:
  id: ui_sound
  output: ui_speaker_output
  gain: 18%

script:
  - id: restore_status_led
    mode: restart
    then:
      - if:
          condition:
            wifi.ap_active:
          then:
            - light.turn_on:
                id: status_led
                red: 0%
                green: 20%
                blue: 100%
          else:
            - if:
                condition:
                  api.connected:
                    state_subscription_only: true
                then:
                  - light.turn_off: status_led
                else:
                  - if:
                      condition:
                        wifi.connected:
                      then:
                        - light.turn_on:
                            id: status_led
                            red: 100%
                            green: 100%
                            blue: 0%
                      else:
                        - light.turn_on:
                            id: status_led
                            red: 100%
                            green: 0%
                            blue: 0%
  - id: ui_sound_tap
    mode: restart
    then:
      - rtttl.play: "tap:d=32,o=6,b=180:c"
  - id: ui_sound_navigation
    mode: restart
    then:
      - rtttl.play: "nav:d=32,o=6,b=200:g"
  - id: ui_sound_success
    mode: restart
    then:
      - rtttl.play: "ok:d=32,o=6,b=180:c,e"
  - id: ui_sound_error
    mode: restart
    then:
      - rtttl.play: "err:d=16,o=4,b=160:g"

button:
  - platform: template
    name: "Sonido de atención"
    icon: mdi:bell-ring
    on_press:
      - lambda: id(ui_engine_main).play_notification_sound("attention");
  - platform: template
    name: "Sonido de notificación"
    icon: mdi:bell
    on_press:
      - lambda: id(ui_engine_main).play_notification_sound("notification");
  - platform: template
    name: "Sonido de éxito"
    icon: mdi:check-circle
    on_press:
      - lambda: id(ui_engine_main).play_notification_sound("success");
  - platform: template
    name: "Sonido de advertencia"
    icon: mdi:alert
    on_press:
      - lambda: id(ui_engine_main).play_notification_sound("warning");
  - platform: template
    name: "Sonido de error"
    icon: mdi:close-circle
    on_press:
      - lambda: id(ui_engine_main).play_notification_sound("error");

light:
  - platform: rgb
    id: status_led
    name: "LED de notificaciones"
    icon: mdi:led-outline
    red: status_led_red
    green: status_led_green
    blue: status_led_blue
    restore_mode: ALWAYS_OFF
    effects:
      - pulse:
          name: "Pulso lento"
          transition_length: 1s
          update_interval: 1s
      - pulse:
          name: "Pulso rapido"
          transition_length: 250ms
          update_interval: 250ms
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_output
    restore_mode: ALWAYS_ON

font:
  # Fuente de texto para títulos y botones. Incluye español explícitamente para
  # que caracteres como ñ, tildes y ¿¡ no aparezcan como cuadrados en LVGL.
