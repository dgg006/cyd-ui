display:
  - platform: mipi_spi
    id: cyd_display
    spi_id: display_spi
    model: ESP32-2432S028
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: xpt2046
    id: cyd_touch
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    threshold: 400
    calibration:
      x_min: 200
      x_max: 3700
      y_min: 240
      y_max: 3800
    transform:
      mirror_x: true
    on_touch:
      - lambda: |-
          if (!id(ui_engine_main).handle_calibration_touch(touch)) {
            id(ui_engine_main).notify_activity();
          }
    on_update:
      - lambda: id(ui_engine_main).handle_calibration_update(touches);
    on_release:
      - lambda: |-
          if (!id(ui_engine_main).handle_calibration_release()) {
            id(ui_engine_main).notify_touch_released();
          }

lvgl:
  id: cyd_lvgl
  rotation: 90
  displays:
    - cyd_display
  touchscreens:
    - touchscreen_id: cyd_touch
  buffer_size: 8%
  bg_color: 0x101820
  text_color: 0xFFFFFF
  default_font: text_font_14
  widgets:
    - button:
        hidden: true
        widgets:
          - label:
              text: "ui_engine module declaration"

ui_engine:
  id: ui_engine_main
  config_file: config/ui.json
  time_id: system_time
  icon_font_id: mdi_icons_28
  clock_time_font_id: clock_time_font_60
  clock_date_font_id: clock_date_font_18
  backlight_output_id: backlight_output
  sound_id: ui_sound
  touchscreen_id: cyd_touch
  screensaver_timeout: 30s
  on_action:
    - if:
        condition:
          lambda: return id(ui_engine_main).prepare_touch_sound();
        then:
          - script.execute: ui_sound_tap
    - logger.log:
        format: "UI action: control_id=%s action=%s"
        args:
          - control_id.c_str()
          - action.c_str()
    - homeassistant.event:
        event: esphome.cyd_ui_action
        data:
          control_id: !lambda return control_id;
          action: !lambda return action;
  on_navigation:
    - if:
        condition:
          lambda: return id(ui_engine_main).prepare_navigation_sound();
        then:
          - script.execute: ui_sound_navigation
